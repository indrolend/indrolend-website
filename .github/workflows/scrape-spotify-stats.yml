name: Scrape Spotify for Artists Stats

on:
  schedule:
    # Run once daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      
      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt
      
      - name: Run Spotify scraper
        env:
          SPOTIFY_EMAIL: ${{ secrets.SPOTIFY_EMAIL }}
          SPOTIFY_PASSWORD: ${{ secrets.SPOTIFY_PASSWORD }}
        run: |
          python scripts/scrape_spotify_artists.py
      
      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/spotify_stats.json
          if ! git diff --staged --quiet; then
            git commit -m "Update Spotify for Artists stats [automated]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          else
            echo "No changes to commit"
          fi
