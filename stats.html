<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Stats / Indrolend</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <script defer src="script.js"></script>
  <script defer src="spotify-stats.js"></script>
</head>
<body class="home-bg">
  <canvas id="particles-bg"></canvas>
  
  <div class="home-container">
    <header class="home-header">
      <h1 class="stats-title">
        <a href="home.html" class="stats-back-link">←</a>
        <span class="important-word">spotify artist stats</span>
      </h1>
    </header>

    <main class="stats-main">
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-icon">🎤</div>
          <div class="stat-content">
            <div class="stat-label">Artist</div>
            <div id="artistName" class="important-word stat-value">Loading...</div>
          </div>
        </div>

        <div class="stat-box">
          <div class="stat-icon">👥</div>
          <div class="stat-content">
            <div class="stat-label">Followers</div>
            <div id="artistFollowers" class="important-word stat-value">Loading...</div>
          </div>
        </div>

        <div class="stat-box">
          <div class="stat-icon">⭐</div>
          <div class="stat-content">
            <div class="stat-label">Popularity</div>
            <div id="artistPopularity" class="important-word stat-value">Loading...</div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
