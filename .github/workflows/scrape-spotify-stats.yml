name: Scrape Spotify for Artists Stats

on:
  schedule:
    # Run once daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
      
      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt
      
      - name: Run Spotify scraper
        env:
          SPOTIFY_EMAIL: ${{ secrets.SPOTIFY_EMAIL }}
          SPOTIFY_PASSWORD: ${{ secrets.SPOTIFY_PASSWORD }}
        run: |
          python scripts/scrape_spotify_artists.py
      
      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/spotify_stats.json
          if ! git diff --staged --quiet; then
            git commit -m "Update Spotify for Artists stats [automated]"
            # Pull with rebase to handle concurrent changes, then push
            # Retry up to 3 times in case of concurrent updates
            for attempt in {1..3}; do
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }} && git push && break || {
                if [ $attempt -eq 3 ]; then
                  echo "Failed to push after 3 attempts"
                  exit 1
                fi
                echo "Push failed, retrying in 5 seconds..."
                sleep 5
              }
            done
          else
            echo "No changes to commit"
          fi
