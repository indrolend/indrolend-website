name: Parse Screenshots

on:
  push:
    paths:
      - 'screenshots/**'
      - '!screenshots/README.md'
  workflow_dispatch:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  parse-screenshots:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      
      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt
      
      - name: Run screenshot parser
        run: |
          python scripts/parse_screenshots.py
      
      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/parsed-stats.json screenshots/
          if ! git diff --staged --quiet; then
            git commit -m "Update parsed stats from screenshots"
            # Pull with rebase to handle concurrent changes, then push
            # Retry up to 3 times in case of concurrent updates
            for attempt in {1..3}; do
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }} && git push && break || {
                if [ $attempt -eq 3 ]; then
                  echo "Failed to push after 3 attempts"
                  exit 1
                fi
                echo "Push failed, retrying in 5 seconds..."
                sleep 5
              }
            done
          fi
