<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="description" content="Indrolend - Music, content, and interactive experiences" />
  <meta name="theme-color" content="#020612" />
  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Indrolend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/spotify-styles.css" />
  <link rel="stylesheet" href="../css/spotify-analytics-styles.css" />
  <link rel="stylesheet" href="../css/spotify-artists-stats.css" />
  <!-- Security utilities must load first -->
  <script defer src="../js/security-utils.js"></script>
  <script defer src="../js/particle-transition-engine.js"></script>
  <script defer src="../js/script.js"></script>
  <script defer src="../js/spotify-integration.js"></script>
  <script defer src="../js/spotify-analytics-data.js"></script>
  <script defer src="../js/spotify-analytics.js"></script>
  <script defer src="../js/spotify-artists-stats.js"></script>
  <script defer src="../js/easter-egg.js"></script>
  <script defer src="../js/particle-clusters.js"></script>
  <script defer src="../js/cursor-character-effect.js"></script>
  <script defer src="../js/genie-transition.js"></script>
</head>
<body class="home-bg">
  <canvas id="particles-bg"></canvas>

  <div class="home-container">
    <header class="home-header fade-in-element">
      <div class="home-header-image-wrap">
        <img src="../assets/images/5992CDB8.jpg" alt="Indrolend header" class="home-header-image" />
      </div>
      <!-- Glitchy button (only shown when all Asymptote upgrades purchased) -->
      <a id="glitchy-dev-history-btn" class="glitchy-button" href="dev-history.html" style="display: none;">
        <span class="glitch-text" data-text="DEVELOPMENT HISTORY">DEVELOPMENT HISTORY</span>
      </a>
    </header>

    <section class="home-main">
      <!-- Spotify for Artists Stats (from scraper) -->
      <div id="spotify-artists-stats" style="display: none;"></div>

      <!-- Spotify Analytics Dashboard -->
      <div id="spotify-analytics-placeholder" style="display: none;"></div>

      <!-- Spotify Data Integration -->
      <div id="spotify-data-placeholder" style="display: none;"></div>

      <div class="embed-wrapper fade-in-element delay-1">
        <iframe style="border: 0; width: 350px; height: 470px;" src="https://bandcamp.com/EmbeddedPlayer/album=3391978805/size=large/bgcol=ffffff/linkcol=2ebd35/tracklist=false/transparent=true/" seamless><a href="https://indrolend.bandcamp.com/album/hd">HD by Indrolend</a></iframe>
      </div>

      <div class="app-grid fade-in-element delay-2">
        <a class="app-card" href="https://www.tiktok.com/@indrolend" target="_blank" rel="noopener">
          <div class="app-card-media" data-bg="tiktok">
            <canvas data-particle-cluster="tiktok" aria-label="TikTok"></canvas>
          </div>
          <div class="app-card-label"><span class="important-word">tiktok</span></div>
        </a>

        <a class="app-card" href="https://www.instagram.com/indrolend.us?igsh=dzAwdWtyOTVienF5&amp;utm_source=qr" target="_blank" rel="noopener">
          <div class="app-card-media">
            <canvas data-particle-cluster="instagram" aria-label="Instagram"></canvas>
          </div>
          <div class="app-card-label"><span class="important-word">instagram</span></div>
        </a>

        <a class="app-card" href="https://open.spotify.com/artist/59X3431NBfd6xWMc3Zlh0v?si=RepR9WX8Q8mX1sQoME1ckQ" target="_blank" rel="noopener">
          <div class="app-card-media" data-bg="spotify">
            <canvas data-particle-cluster="spotify" aria-label="Spotify"></canvas>
          </div>
          <div class="app-card-label"><span class="important-word">spotify</span></div>
        </a>

        <a class="app-card" href="https://music.apple.com/us/artist/onliner/1663334902" target="_blank" rel="noopener">
          <div class="app-card-media" data-bg="applemusic">
            <canvas data-particle-cluster="applemusic" aria-label="Apple Music"></canvas>
          </div>
          <div class="app-card-label"><span class="important-word">apple music</span></div>
        </a>

        <a class="app-card" href="https://www.youtube.com/@indrolend" target="_blank" rel="noopener">
          <div class="app-card-media" data-bg="youtube">
            <canvas data-particle-cluster="youtube" aria-label="YouTube"></canvas>
          </div>
          <div class="app-card-label"><span class="important-word">youtube</span></div>
        </a>

        <a class="app-card" href="https://indrolend.bandcamp.com" target="_blank" rel="noopener">
          <div class="app-card-media" data-bg="bandcamp">
            <canvas data-particle-cluster="bandcamp" aria-label="Bandcamp"></canvas>
          </div>
          <div class="app-card-label"><span class="important-word">bandcamp</span></div>
        </a>

        <a class="app-card" id="galleryCard" href="gallery.html">
          <div class="app-card-media">
            <canvas data-particle-cluster="gallery" aria-label="image gallery"></canvas>
          </div>
          <div class="app-card-label"><span class="important-word">image gallery</span></div>
        </a>

        <a class="app-card" id="journalCard" href="journal.html" style="display: none;">
          <div class="app-card-media">
            <canvas data-particle-cluster="journal" aria-label="journal"></canvas>
          </div>
          <div class="app-card-label"><span class="important-word">journal</span></div>
        </a>

        <a class="app-card" href="../asymptote/index.html">
          <div class="app-card-media wordgame-icon-wrap">
            <span id="wordgameIcon" class="wordgame-icon-char">X</span>
          </div>
          <div class="app-card-label"><span class="important-word">Asymptote engine</span></div>
        </a>
      </div>
    </section>
  </div>
</body>
</html>
