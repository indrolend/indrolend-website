<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="description" content="Tic-Tac-Toe Challenge - Indrolend" />
  <meta name="theme-color" content="#020612" />
  <title>Tic-Tac-Toe / Indrolend</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script defer src="../js/script.js"></script>
</head>
<body class="ttt-bg">
  <div class="ttt-container">
    <header class="ttt-header">
      <h1>image gallery lock</h1>
      <p>win to open the gallery.</p>
    </header>

    <main class="ttt-main">
      <canvas id="tttGameCanvas" class="ttt-game-canvas"></canvas>
      <div id="tttStatus" class="ttt-status"></div>
    </main>
  </div>

  <div id="tttWinModal" class="ttt-modal hidden">
    <div class="ttt-modal-inner">
      <p>image gallery unlocked.</p>
      <button id="tttWinOk" class="ttt-win-ok">ok</button>
    </div>
  </div>
</body>
</html>
